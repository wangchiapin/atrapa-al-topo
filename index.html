<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>打地鼠學中文 · Atrapa al Topo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --sky:#5C94FC; --sky-light:#8FC1FF;
      --grass-mid:#3FAF3F; --grass-dark:#2E8B2E;
      --dirt-dark:#7A6551; --dirt-mid:#A08A70;
      --brick:#C84C0C; --brick-dark:#8B2E00; --brick-light:#E2711D;
      --coin-gold:#FBD000;
      --pipe-green:#1E9E3D; --pipe-dark:#136B27;
      --cream:#FFF6E0; --cream-dark:#F0E0B8; --ink:#3A2A1A;
      --red:#E52521;
      --kmul: 1;                  /* 字卡文字倍率：手機版會調大 */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }

    body {
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.5) 0 60px, transparent 61px),
        radial-gradient(circle at 80% 12%, rgba(255,255,255,0.4) 0 44px, transparent 45px),
        linear-gradient(180deg, var(--sky) 0%, var(--sky-light) 100%);
      font-family: "Baloo 2", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
      height: 100vh; height: 100dvh;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* ===== 主容器：電腦版接近滿版 ===== */
    #app-container {
      width: min(96vw, 1600px);
      height: min(94vh, 1000px); height: min(94dvh, 1000px);
      background: var(--cream);
      border-radius: 18px;
      border: 6px solid var(--ink);
      box-shadow: 0 12px 0 rgba(0,0,0,0.25), 0 12px 30px rgba(0,0,0,0.3);
      display: flex; flex-direction: column;
      overflow: hidden; position: relative;
    }

    header {
      height: 10%; min-height: 52px; flex: none;
      color: white;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 5px, transparent 5px 36px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 5px, transparent 5px 68px),
        linear-gradient(180deg, var(--brick-light), var(--brick));
      border-bottom: 5px solid var(--brick-dark);
      box-shadow: inset 0 -6px 0 rgba(0,0,0,0.12);
    }
    .brand-title{
      display: flex; align-items: baseline; gap: 10px;
      font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: 1px;
      text-shadow: 2px 2px 0 var(--brick-dark);
      white-space: nowrap;
    }
    .brand-title .tr{ font-size: 14px; letter-spacing: 0; margin-left: 0; opacity: .95; }
    #stat-tracker{
      font-weight: 800; font-size: 22px;
      background: rgba(0,0,0,0.28);
      padding: 6px 18px; border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.4);
      white-space: nowrap;
    }
    /* 雙語介面：中文在前，西文／英文接在後面變小字 */
    small.tr{ font-size: max(.7em, 10px); font-weight: 700; margin-left: .4em; opacity: .8; }

    /* 版面：左邊（上）題目橫幅、（下）遊戲區；右邊（上）計時、（下）設定與開始鈕 */
    #main-content {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 1fr clamp(300px, 24vw, 380px);
      grid-template-rows: auto 1fr;
      background: var(--cream-dark);
      --ts-max: 54px;             /* 題目句子的最大字級（句子太長會自動縮小） */
    }
    #game-area { grid-column: 1; grid-row: 2; }
    #side-bg{
      grid-column: 2; grid-row: 1 / 3;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 4px, transparent 4px 34px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 4px, transparent 4px 64px),
        var(--cream-dark);
      border-left: 5px solid var(--ink);
    }
    /* #hud 本身不佔版面：裡面的計時放右欄、題目橫幅放左上（手機直式再改成上下排） */
    #hud{ display: contents; }
    #controls{
      grid-column: 2; grid-row: 2; min-height: 0;
      padding: 4px 16px 14px;
      display: flex; flex-direction: column; justify-content: space-between;
      overflow-y: auto; position: relative; z-index: 1;
    }

    /* ===== 草地（單純漸層，不干擾判斷） ===== */
    #game-area {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px 14px;
      padding: 14px 20px 16px;
      background: linear-gradient(180deg, var(--grass-mid) 0%, var(--grass-dark) 100%);
      border-top: 4px solid var(--ink);
      isolation: isolate;        /* 地鼠洞的層級只在草地裡有效，不會蓋到手機的設定彈窗 */
      cursor: none;              /* 用自己畫的槌子取代游標 */
      touch-action: manipulation;
      min-width: 0; min-height: 0;
    }

    /* ===== 每一格：洞 + 地鼠 + 字卡 ===== */
    .cell{
      position: relative;
      container-type: size;       /* 讓內部尺寸跟著格子大小等比縮放 */
      min-width: 0; min-height: 0;
      --mw: min(48cqw, 58cqh);              /* 地鼠寬度 */
      --hw: calc(var(--mw) * 1.75);         /* 洞的寬度（比地鼠寬，才像從洞裡冒出來） */
    }
    .hole{
      position: absolute; left: 50%; bottom: 3cqh;
      width: var(--hw); aspect-ratio: 200 / 80;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .hole svg{ width:100%; height:100%; display:block; overflow:visible; }
    .hole.back  { z-index: 1; }
    .hole.front { z-index: 3; }

    /* 地鼠只在洞口內側底線以上顯示，其餘被裁掉 */
    .mole-clip{
      position: absolute; left: 0; right: 0; top: 0;
      bottom: calc(3cqh + var(--hw) * 0.4 * 0.175);
      overflow: hidden;
      z-index: 2;
      pointer-events: none;
    }
    .mole{
      position: absolute; left: 50%; bottom: 0;
      width: var(--mw);
      transform: translate(-50%, 110%);
      transition: transform .22s cubic-bezier(.34,1.45,.64,1);
      pointer-events: auto;
    }
    .cell.up .mole{ transform: translate(-50%, 0); }
    .mole svg{ width: 100%; height: auto; display: block; overflow: visible; transform-origin: 50% 100%; }

    .mole .face{ display:none; }
    .mole[data-face="1"] .f1,
    .mole[data-face="2"] .f2,
    .mole[data-face="3"] .f3,
    .mole[data-face="4"] .f4,
    .mole[data-face="5"] .f5{ display:inline; }
    .mole .fx, .mole .stars{ display:none; }
    .mole.hit .face{ display:none; }
    .mole.hit .fx{ display:inline; }
    .mole.hit .stars{ display:inline; animation: spin .7s linear infinite; transform-origin: 60px 4px; }
    .mole.hit svg{ animation: squash .28s ease-out; }
    @keyframes squash{
      0%   { transform: scale(1,1); }
      30%  { transform: scale(1.12,.78); }
      100% { transform: scale(1,1); }
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }

    /* ===== 字卡：掛在肚子的位置，不擋臉 ===== */
    .card-wrap{
      position: absolute; left: 50%;
      bottom: calc(3cqh + var(--hw) * 0.4 * 0.02);
      transform: translate(-50%, 45%) scale(.6);
      opacity: 0;
      transition: transform .2s cubic-bezier(.34,1.45,.64,1), opacity .12s;
      z-index: 4;
      pointer-events: none;
    }
    .cell.up .card-wrap{ transform: translate(-50%, 0) scale(1); opacity: 1; pointer-events: auto; }
    .cell.hit .card-wrap{ opacity: 0; transition: opacity .15s; }
    .cell.bonus .card-wrap{ display: none; }

    .word-card{
      --k: .32;
      min-width: calc(var(--mw) * .7);
      background: var(--cream);
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: .04em .38em .1em;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 3px 0 var(--ink);
      white-space: nowrap; text-align: center;
    }
    /* 字大小：以地鼠寬度為準，但字卡不能比格子寬（--n = 字數、--pl = 注音/拼音的大約寬度） */
    .word-text{
      font-size: min(calc(var(--mw) * var(--k) * var(--kmul)), calc(90cqw / var(--n, 2)));
      font-weight: 800; line-height: 1.12;
      color: var(--brick-dark);
    }
    .phon-text{
      display: none;
      font-size: max(8px, min(calc(var(--mw) * .135 * var(--kmul)), calc(88cqw / var(--pl, 6))));
      color: var(--pipe-dark); font-weight: 700; line-height: 1.1;
    }
    #game-area.ph-on .phon-text{ display: block; }

    /* ===== 槌子 ===== */
    #hammer{
      position: fixed; left: 0; top: 0; width: 84px; height: 84px;
      pointer-events: none; z-index: 80; display: none;
      will-change: transform;
    }
    #hammer .img{
      width: 100%; height: 100%;
      transform-origin: 50% 95%;
      transform: rotate(28deg);
      transition: transform .14s ease-out;
    }
    #hammer.swing .img{ transform: rotate(-10deg); transition: transform .05s ease-in; }

    /* ===== 右側：計時、題目、設定 ===== */
    .timer-box{
      font-size: 20px; color: var(--coin-gold); text-align: center;
      background: #1c1c1c; padding: 10px 8px; border-radius: 8px;
      border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px #000; letter-spacing: 1px;
      margin-bottom: 10px; white-space: nowrap;
    }
    /* 電腦版：計時放在右欄上方，跟題目橫幅同一列 */
    .timer-box{ grid-column: 2; grid-row: 1; align-self: center; margin: 14px 16px; position: relative; z-index: 1; }

    /* ===== 題目橫幅（在地鼠上方）：高度固定，換句子、發光提示都不會讓版面跳動 ===== */
    .target-box{
      grid-column: 1; grid-row: 1; align-self: center; margin: 10px 20px;
      height: clamp(124px, 17vh, 164px);
      background: var(--cream); padding: 8px 14px 8px 18px; border-radius: 12px;
      border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
      position: relative;
      display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto minmax(0, 1fr); column-gap: 10px;
    }
    #target-lbl{
      grid-column: 1; grid-row: 1;
      font-size: 14px; font-weight: 800; color: var(--ink); opacity: .75;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #target-lbl.hint{ opacity: 1; color: var(--brick-dark); }   /* 連錯 3 次：同一個位置改顯示提示字 */
    #replay-btn{
      grid-column: 2; grid-row: 1 / 3; align-self: center;
      width: 52px; height: 52px; border-radius: 50%;
      border: 3px solid var(--ink); background: var(--coin-gold); font-size: 24px; line-height: 1;
      cursor: pointer; box-shadow: 0 3px 0 var(--ink); display: flex; align-items: center; justify-content: center;
    }
    #replay-btn:active{ transform: translateY(3px); box-shadow: none; }
    #replay-btn:disabled{ opacity: .4; cursor: not-allowed; }
    #review{ display:none; text-align:left; margin-top:6px; max-height: 42vh; overflow-y:auto; border-top:3px dashed rgba(58,42,26,.35); padding-top:8px; }
    #review.on{ display:block; }
    #review .rv-title{ font-weight:800; font-size:14px; color:var(--brick-dark); margin-bottom:4px; }
    .rv-item{ display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid rgba(58,42,26,.18); }
    .rv-item button{ flex:none; width:32px; height:32px; border-radius:50%; border:2px solid var(--ink); background:var(--coin-gold); cursor:pointer; font-size:14px; }
    .rv-zh{ font-size:20px; font-weight:800; color:var(--brick-dark); line-height:1.25; }
    .rv-ph{ font-size:12px; font-weight:700; color:var(--pipe-dark); }
    .rv-es{ font-size:14px; font-weight:600; color:var(--ink); }
    .modal-content{ max-height: 92%; overflow-y: auto; }
    .modal-content.wide{ width: min(480px, 92vw); }

    /* 題目句子：每個詞上面標拼音／注音；字級由程式依句子長度自動縮放（最大值是 --ts-max） */
    .target-sentence{
      grid-column: 1; grid-row: 2; min-height: 0; position: relative;
      font-size: var(--ts-max); font-weight: 800; color: var(--brick-dark); line-height: 1.1;
      display: flex; flex-wrap: wrap; justify-content: center; align-content: center; align-items: flex-end;
      gap: .2em .5em;
    }
    .target-sentence.placeholder{
      font-size: 18px; font-weight: 700; color: var(--ink); align-items: center; text-align: center;
    }
    .target-char{
      display: inline-flex; flex-direction: column; align-items: center;
      padding: .02em .14em .06em; border-radius: .16em;
    }
    .tc-ph{ font-size: .4em; font-weight: 700; color: var(--pipe-dark); line-height: 1.25; white-space: nowrap; }
    .tc-zh{ white-space: nowrap; }
    .target-char.completed{ color: var(--pipe-dark); }
    .target-char.completed .tc-zh{ text-decoration: underline; }
    .target-char.current{ background: var(--coin-gold); box-shadow: inset 0 -.1em 0 var(--brick); }  /* 用內陰影，不佔高度 */

    @keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9%)} 40%{transform:translateX(8%)} 60%{transform:translateX(-6%)} 80%{transform:translateX(4%)} }
    .cell.hit.wrong .card-wrap{ opacity: 1; transition: none; }
    .cell.hit.wrong .word-card{ animation: shake .3s ease-in-out; }
    @keyframes nudge{ 0%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} 60%{transform:translateY(0)} 80%{transform:translateY(-3px)} }
    .target-char.nudge{ animation: nudge .45s ease-out; }
    /* 連錯 3 次：目標詞發光並放大。只用 transform 放大，不會改變橫幅的高度；放大時蓋在鄰居上面 */
    @keyframes glow{
      0%,100%{ transform: scale(1.25); box-shadow: 0 0 0 0 rgba(251,208,0,0), inset 0 -.1em 0 var(--brick); background: var(--coin-gold); }
      50%    { transform: scale(1.4);  box-shadow: 0 0 .35em .15em rgba(251,208,0,.95), inset 0 -.1em 0 var(--brick); background: #FFF3A0; }
    }
    .target-char.glow{ animation: glow .7s ease-in-out infinite; position: relative; z-index: 2; }
    #settings-close{ display: none; }
    .set-title{ font-size: 13px; font-weight: 800; color: var(--ink); margin: 8px 0 4px; }
    .set-group{ margin-bottom: 8px; }
    .set-group .lbl{ font-size: 12px; font-weight: 700; color: var(--ink); opacity: .75; margin-bottom: 2px; }
    .seg{
      display: flex; border: 3px solid var(--ink); border-radius: 8px; overflow: hidden;
      background: var(--cream); box-shadow: 0 2px 0 var(--ink);
    }
    .seg button{
      flex: 1; padding: 6px 2px; border: 0; border-left: 2px solid var(--ink);
      background: transparent; color: var(--ink); cursor: pointer;
      font-family: "Baloo 2", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 700; font-size: 14px;
    }
    .seg button:first-child{ border-left: 0; }
    .seg button.on{ background: var(--coin-gold); }
    .seg button:disabled{ cursor: not-allowed; opacity: .55; }

    .start-row{ display: flex; gap: 8px; margin-top: 10px; }
    button.btn-primary{
      background: linear-gradient(180deg, var(--pipe-green), var(--pipe-dark));
      color: white; border: 3px solid var(--ink);
      font-family: "Baloo 2"; font-weight: 800; flex: 1; width: 100%; padding: 12px; font-size: 18px;
      border-radius: 10px; cursor: pointer; text-shadow: 0 1px 0 rgba(0,0,0,.35);
      box-shadow: 0 5px 0 var(--pipe-dark);
    }
    button.btn-primary:active{ transform: translateY(4px); box-shadow: 0 1px 0 var(--pipe-dark); }
    button.btn-primary:disabled{ opacity: .6; cursor: not-allowed; transform: none; }
    button.btn-restart{
      background: linear-gradient(180deg, #F29A3A, #C9701A); box-shadow: 0 5px 0 #C9701A;
    }
    button.btn-restart:active{ box-shadow: 0 1px 0 #C9701A; }
    #settings-toggle{
      display: none; flex: none; width: 56px; align-items: center; justify-content: center;
      background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px;
      font-size: 24px; cursor: pointer; box-shadow: 0 5px 0 var(--ink);
    }
    #settings-toggle:active{ transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
    /* 背景和彈窗都放在 #controls 裡面（同一個層次），彈窗才一定在背景上面 */
    #sheet-backdrop{ display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1; }

    /* ===== 結算 ===== */
    #result-modal{
      position: absolute; inset: 0; background: rgba(20,30,10,.72);
      display: none; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content{
      background: var(--cream); padding: 26px; border-radius: 14px;
      border: 5px solid var(--ink); box-shadow: 0 8px 0 var(--ink);
      text-align: center; width: min(320px, 86vw);
    }
    .modal-content h2{ font-size: 24px; font-weight: 800; line-height: 1.3; color: var(--brick-dark); margin-bottom: 16px; }
    .modal-content p{ font-weight: 700; margin: 8px 0; font-size: 17px; }
    .modal-content button{ margin-top: 16px; }

    #firework-canvas{ position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

    /* =====================================================================
       手機／小視窗：整個畫面滿版，設定收進 ⚙ 彈窗
       ===================================================================== */
    @media (max-width: 600px), (max-height: 560px) {
      :root{ --kmul: 1.35; }        /* 格子很窄時，字卡的字再放大一點 */
      /* 窄螢幕：上方計分的中文在上、西文／英文小字在下（兩行），數字放右邊，這樣雙語也放得下 */
      #stat-tracker{ display: flex; align-items: center; gap: 8px; }
      #stat-tracker .st{ display: flex; align-items: center; gap: 4px; }
      #stat-tracker .st-l{ display: flex; flex-direction: column; line-height: 1.05; }
      #stat-tracker .st-l .tr{ margin: 1px 0 0; font-size: 9px; letter-spacing: 0; }
      #stat-tracker .st-c{ display: none; }
      #stat-tracker .st-n{ font-size: 1.1em; }
      #stat-tracker .st-sep{ opacity: .35; }
    }
    @media (max-width: 820px), (max-height: 560px) {
      #app-container{ width: 100vw; height: 100vh; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
      header{ height: 44px; min-height: 0; padding: 0 12px; }
      .brand-title{ flex-direction: column; align-items: flex-start; gap: 0; font-size: 18px; letter-spacing: 0; }
      .brand-title .tr{ font-size: 10px; }
      #stat-tracker{ font-size: 14px; padding: 3px 9px; }
      #game-area{ padding: 10px 10px 12px; gap: 6px 8px; }
      .cell{ --mw: min(54cqw, 58cqh); }
      .timer-box{ font-size: 15px; padding: 7px 8px; margin-bottom: 0; }
      .target-box{ padding: 6px 10px 6px 12px; }
      #target-lbl{ font-size: 12px; }
      #replay-btn{ width: 44px; height: 44px; font-size: 20px; }
      .target-sentence.placeholder{ font-size: 15px; }

      #settings-toggle{ display: flex; }
      #settings-close{
        display: block; position: absolute; top: 8px; right: 10px;
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid var(--ink); background: var(--cream); color: var(--ink);
        font-size: 16px; font-weight: 800; cursor: pointer;
      }
      #settings-sheet{
        display: none;
        position: fixed; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(92vw, 420px); max-height: 88vh; max-height: 88dvh; overflow-y: auto;
        background: var(--cream); border: 4px solid var(--ink); border-radius: 14px;
        box-shadow: 0 8px 0 var(--ink); padding: 8px 16px 14px;
      }
      #settings-sheet.open{ display: block; }
      #sheet-backdrop.open{ display: block; }
      .seg button{ padding: 9px 2px; font-size: 15px; }
      .start-row{ margin-top: 0; }
      button.btn-primary{ padding: 10px; font-size: 18px; }
    }

    /* 直式手機／窄視窗：上（計時+題目）、中（地鼠）、下（按鈕）*/
    @media (max-width: 820px) and (orientation: portrait) {
      #main-content{ grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; --ts-max: 38px; }
      #side-bg{ display: none; }
      #hud{
        grid-column: 1; grid-row: 1;
        display: flex; flex-direction: column; gap: 8px;
        padding: 8px 10px 10px; background: var(--cream-dark); border-bottom: 4px solid var(--ink);
        position: relative; z-index: 1;
      }
      /* 計時器和縮小的 🔊 一起放在題目橫幅右上角（計時器由程式搬進橫幅，見 placeTimer），句子用滿整個橫幅寬度 */
      .target-box{
        grid-column: auto; grid-row: auto; align-self: stretch; margin: 0; height: clamp(104px, 16vh, 140px);
        grid-template-columns: 1fr auto auto; grid-template-rows: auto minmax(0, 1fr); column-gap: 6px;
      }
      #target-lbl{ grid-column: 1; grid-row: 1; align-self: start; white-space: normal; line-height: 1.15; font-size: 12px; }
      #target-lbl .tr{ display: block; margin: 1px 0 0; font-size: 10px; }
      .target-box .timer-box{
        grid-column: 2; grid-row: 1; align-self: start; width: auto; margin: 0;
        font-size: 15px; padding: 4px 9px; border-radius: 8px;
      }
      #replay-btn{ grid-column: 3; grid-row: 1; align-self: start; width: 32px; height: 32px; font-size: 15px; box-shadow: none; }
      .target-sentence{ grid-column: 1 / -1; grid-row: 2; }
      #hud{ padding: 8px 10px; }
      #game-area{
        grid-column: 1; grid-row: 2; border-top: 0;
        grid-template-rows: repeat(3, minmax(0, 1fr));   /* 三排平分可用高度：畫面再矮，最下面一排也不會被按鈕列蓋住 */
      }
      .cell{ aspect-ratio: auto; }
      #controls{
        grid-column: 1; grid-row: 3; overflow: visible;
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
        background: var(--cream-dark); border-top: 4px solid var(--ink);
      }
    }

    /* 橫式手機：左邊地鼠、右邊窄欄 */
    @media (orientation: landscape) and (max-height: 560px), (orientation: landscape) and (max-width: 820px) {
      #main-content{ grid-template-columns: 1fr 210px; --ts-max: 30px; }
      .timer-box{ margin: 8px 10px; }
      .target-box{ margin: 6px 10px; height: clamp(78px, 27vh, 112px); }
      #game-area{ border-top-width: 3px; }
      #controls{ padding: 4px 10px 10px; justify-content: flex-end; overflow: visible; }
    }
  
    /* =====================================================================
       無印風：米白底、細框線、柔和的灰綠草地；重點色只留給「目前要打的詞」
       ===================================================================== */
    :root{ --brick:#B9805A; --brick-dark:#6B4A36; --brick-light:#B9805A; --coin-gold:#EBCB7E;
           --pipe-green:#7F9B70; --pipe-dark:#5E7A52; --cream:#FBF9F5; --cream-dark:#F1ECE3; --ink:#4A3F35; --red:#C0584A; }
    body{ background:#E9E4DA; }
    #app-container{ border:1px solid #D9D1C3; border-radius:14px; box-shadow:0 10px 30px rgba(74,63,53,.14); }
    header{ background:#F6F2EA; color:var(--ink); border-bottom:1px solid #D9D1C3; box-shadow:none; }
    .brand-title{ text-shadow:none; letter-spacing:.5px; }
    #stat-tracker{ background:#fff; border:1px solid #D9D1C3; color:var(--ink); }
    #side-bg{ background:var(--cream-dark); border-left:1px solid #D9D1C3; }
    #game-area{ border-top:1px solid #D9D1C3; background:linear-gradient(180deg,#B9C6AA,#A7B797); }
    .timer-box{ background:#fff; color:var(--ink); border:1px solid #D9D1C3; box-shadow:none; font-family:inherit; font-weight:800; letter-spacing:2px; }
    .target-box{ background:#fff; border:1px solid #D9D1C3; box-shadow:0 2px 0 rgba(74,63,53,.06); }
    #replay-btn{ border:1px solid #D9D1C3; box-shadow:none; background:#F3E3B5; }
    .seg{ border:1px solid #D9D1C3; box-shadow:none; background:#fff; }
    .seg button{ border-left:1px solid #D9D1C3; }
    .seg button.on{ background:#EBDDB8; }
    button.btn-primary{ border:0; box-shadow:none; background:#7F9B70; text-shadow:none; }
    button.btn-restart{ background:#C79A6B; box-shadow:none; }
    #settings-toggle{ border:1px solid #D9D1C3; box-shadow:none; }
    .word-card{ border:2px solid #8C7860; box-shadow:none; background:#fff; }
    .modal-content{ border:1px solid #D9D1C3; box-shadow:0 8px 30px rgba(0,0,0,.15); }
    .target-char.current{ background:#F3E3B5; box-shadow:inset 0 -.08em 0 #B9805A; }
    .tc-ph, .phon-text, .target-char.completed{ color:#6F8A62; }
    /* 設定彈窗的細框只用在手機（電腦版的設定直接放在右側欄，不要框） */
    @media (max-width: 820px), (max-height: 560px) {
      #settings-sheet{ border:1px solid #D9D1C3; box-shadow:0 8px 30px rgba(74,63,53,.2); }
      #settings-close{ border:1px solid #D9D1C3; }
    }
    @media (max-width: 820px) and (orientation: portrait) {
      #hud{ border-bottom:1px solid #D9D1C3; }
      #controls{ border-top:1px solid #D9D1C3; }
    }
    @media (orientation: landscape) and (max-height: 560px), (orientation: landscape) and (max-width: 820px) {
      #game-area{ border-top-width:1px; }
    }

    /* ===== 暱稱、排行榜、分數 ===== */
    #name-modal, #board-modal{
      position: absolute; inset: 0; background: rgba(20,30,10,.72);
      display: none; justify-content: center; align-items: center; z-index: 110;
    }
    #board-modal .modal-content{ width: min(360px, 92vw); }
    .nick-input{
      width: 100%; padding: 9px 10px; font-size: 16px; font-family: inherit; font-weight: 700; color: var(--ink);
      background: #fff; border: 1px solid #D9D1C3; border-radius: 8px; outline: none;
    }
    .nick-input:focus{ border-color: #7F9B70; }
    #name-modal .nick-input{ text-align: center; font-size: 18px; }
    .nick-hint{ font-size: 12px !important; font-weight: 600 !important; opacity: .75; margin-top: 6px !important; }
    button.btn-ghost{
      display: block; width: 100%; padding: 9px; margin-top: 10px; border-radius: 8px; cursor: pointer;
      background: #fff; color: var(--ink); border: 1px solid #D9D1C3; box-shadow: none;
      font-family: inherit; font-weight: 700; font-size: 15px;
    }
    button.btn-ghost:active{ background: var(--cream-dark); }
    .score-big{ display: flex; align-items: baseline; justify-content: center; gap: 10px; margin: 2px 0 8px; }
    .score-big .sb-l{ font-size: 15px; font-weight: 700; }
    .score-big strong{ font-size: 40px; line-height: 1; font-weight: 800; color: var(--brick-dark); }
    .rank-line{ min-height: 1.4em; font-size: 15px !important; }
    .rank-line .badge{ display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px; background: #F3E3B5; color: var(--brick-dark); font-size: 13px; }
    #board-tabs{ margin-bottom: 8px; }
    #board-tabs button{ margin-top: 0; }
    #board-body{ min-height: 120px; max-height: 46vh; overflow-y: auto; text-align: left; }
    #board-body .bd-msg{ padding: 28px 0; text-align: center; font-weight: 700; opacity: .7; }
    .bd-list{ list-style: none; margin: 0; padding: 0; }
    .bd-list li{ display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-bottom: 1px solid #E6DFD2; font-weight: 700; }
    .bd-list li.me{ background: #F3E3B5; border-radius: 6px; }
    .bd-rank{ flex: none; width: 1.8em; text-align: center; color: var(--pipe-dark); }
    .bd-name{ flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bd-score{ flex: none; color: var(--brick-dark); font-variant-numeric: tabular-nums; }
    .board-note{ font-size: 12px !important; font-weight: 600 !important; opacity: .7; margin: 8px 0 0 !important; min-height: 1em; }
    #name-modal .btn-primary, #board-modal .btn-primary{ margin-top: 12px; }
    .set-group .nick-input{ padding: 6px 8px; font-size: 16px; }
    #open-board{ margin-top: 6px; }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <span class="brand-title" id="brand">打地鼠學中文<small class="tr">Atrapa al Topo</small></span>

    </div>

    <div id="result-modal">

        <p><span data-i18n="fails"></span>: <strong id="final-errors" style="color: var(--red);">0</strong></p>
        <p><span data-i18n="acc"></span>: <strong id="final-acc">0%</strong></p>

    </div>

    <!-- 第一次按「開始」時問暱稱（輸入完按「開始」就直接開始遊戲） -->
    <div id="name-modal">
      <div class="modal-content">
        <h2 data-i18n="nickAsk"></h2>
        <input id="name-input" class="nick-input" type="text" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false">
        <p class="nick-hint" data-i18n="nickHint"></p>
        <button class="btn-primary" id="name-start" type="button" data-i18n="start"></button>
      </div>
    </div>

    <!-- 排行榜（每個難度一份，前 10 名） -->

      <div class="modal-content">
        <h2 data-i18n="board"></h2>

        <button class="btn-primary" id="board-close" type="button" data-i18n="close"></button>
      </div>
    </div>

    <canvas id="firework-canvas"></canvas>
  </div>

  <!-- 槌子（跟著滑鼠／手指，點擊時會揮下去） -->

    <svg viewBox="0 0 84 84" width="84" height="84">
      <rect x="37" y="30" width="10" height="52" rx="4" fill="#B77A3E" stroke="#3A2A1A" stroke-width="2.5"/>
      <rect x="40" y="34" width="3" height="44" rx="1.5" fill="#D9A066"/>
      <rect x="10" y="6" width="64" height="32" rx="8" fill="#C9CDD3" stroke="#3A2A1A" stroke-width="3"/>
      <rect x="10" y="6" width="14" height="32" rx="7" fill="#8E959E" stroke="#3A2A1A" stroke-width="3"/>
      <rect x="60" y="6" width="14" height="32" rx="7" fill="#8E959E" stroke="#3A2A1A" stroke-width="3"/>
      <rect x="28" y="10" width="28" height="7" rx="3.5" fill="#EEF0F3"/>
    </svg>
  </div></div>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // =====================================================================

        off: 'No', pinyin: 'Pinyin', zhuyin: 'Zhuyin',
        easy: 'Fácil', normal: 'Normal', hard: 'Difícil',

        nickAsk: '¿Cómo te llamas?', nickHint: 'Aparecerá en el ranking (máx. 12 letras)',
        rankNow: 'Puesto', newBest: '¡Nuevo récord!', best: 'Tu mejor marca', notTop: 'Fuera del top 10',
        boardEmpty: 'Aún no hay puntajes', boardLoading: 'Cargando…', boardErr: 'No se pudo conectar',
        localNote: 'Solo se guardan en este dispositivo', saving: 'Guardando…', saveErr: 'No se pudo guardar el puntaje',

    };
    // 中文介面（和上面的西文／英文用同一組代號）
    const ZH = {
      'zh-TW': {
        title: '打地鼠學中文', hits: '答對', errs: '打錯',
        prompt: '照順序打出詞語：', placeholder: '按「開始」載入題目', loading: '載入題目中…',
        settings: '設定', gUi: '介面語言', gScript: '中文字', gPhon: '語音輔助', gDiff: '難度',
        off: '不顯示', pinyin: '拼音', zhuyin: '注音', easy: '簡單', normal: '普通', hard: '困難',
        start: '開始！', review: '📖 複習句子：', hint: '找發光的字！', restart: '🔄 重新開始', over: '🏁 過關！',
        done: '完成句子', fails: '打錯次數', ok: '好',
        score: '分數', acc: '準確度', board: '排行榜', close: '關閉', nick: '暱稱',
        nickAsk: '請輸入暱稱', nickHint: '會顯示在排行榜（最多 12 字）',
        rankNow: '名次', newBest: '新紀錄！', best: '個人最高', notTop: '未進前 10 名',
        boardEmpty: '還沒有紀錄', boardLoading: '載入中…', boardErr: '連線失敗',
        localNote: '紀錄只存在這台裝置', saving: '儲存中…', saveErr: '分數儲存失敗',
        noScore: '至少完成一句才會進排行榜'
      },
      'zh-CN': {
        title: '打地鼠学中文', hits: '答对', errs: '打错',

        settings: '设定', gUi: '界面语言', gScript: '中文字', gPhon: '语音辅助', gDiff: '难度',
        off: '不显示', pinyin: '拼音', zhuyin: '注音', easy: '简单', normal: '普通', hard: '困难',
        start: '开始！', review: '📖 复习句子：', hint: '找发光的字！', restart: '🔄 重新开始', over: '🏁 过关！',
        done: '完成句子', fails: '打错次数', ok: '好',
        score: '分数', acc: '准确度', board: '排行榜', close: '关闭', nick: '昵称',
        nickAsk: '请输入昵称', nickHint: '会显示在排行榜（最多 12 字）',
        rankNow: '名次', newBest: '新纪录！', best: '个人最高', notTop: '未进前 10 名',
        boardEmpty: '还没有纪录', boardLoading: '载入中…', boardErr: '连线失败',
        localNote: '纪录只存在这台装置', saving: '储存中…', saveErr: '分数储存失败',

      }
    };

    // ---- 設定（會記在這台瀏覽器；讀不到就用預設值） ----
    const settings = { ui: 'es', script: 'zh-TW', phon: 'off', diff: 'easy' };
    try{
      const saved = JSON.parse(localStorage.getItem('moleSettings') || '{}');
      if(saved.ui in I18N) settings.ui = saved.ui;
      if(['zh-TW','zh-CN'].includes(saved.script)) settings.script = saved.script;
      if(['off','pinyin','zhuyin'].includes(saved.phon)) settings.phon = saved.phon;
      if(['easy','normal','hard'].includes(saved.diff)) settings.diff = saved.diff;
    }catch(e){}
    function saveSettings(){ try{ localStorage.setItem('moleSettings', JSON.stringify(settings)); }catch(e){} }
    const T = k => I18N[settings.ui][k];                 // 你選的語言（西文／英文）
    const zh = k => ZH[settings.script][k];              // 中文（跟著繁體／簡體）
    const bi = k => `${zh(k)}<small class="tr">${T(k)}</small>`;   // 中文在前、西文／英文小字在後

    // =====================================================================
    //  拼音 → 注音（台灣注音：輕聲點在字前面）
    // =====================================================================
    const ZY_INITIAL = { b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',
                         j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ','':'' };
    const ZY_FINAL = {
      a:'ㄚ',o:'ㄛ',e:'ㄜ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',
      i:'ㄧ',ia:'ㄧㄚ',io:'ㄧㄛ',ie:'ㄧㄝ',iao:'ㄧㄠ',iou:'ㄧㄡ',iu:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',
      u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',uei:'ㄨㄟ',ui:'ㄨㄟ',uan:'ㄨㄢ',uen:'ㄨㄣ',un:'ㄨㄣ',uang:'ㄨㄤ',ueng:'ㄨㄥ',ong:'ㄨㄥ',
      'ü':'ㄩ','üe':'ㄩㄝ','üan':'ㄩㄢ','ün':'ㄩㄣ',ue:'ㄩㄝ'
    };
    const ZY_TONE = ['', '', 'ˊ', 'ˇ', 'ˋ'];
    const TONED = {
      'ā':['a',1],'á':['a',2],'ǎ':['a',3],'à':['a',4],
      'ē':['e',1],'é':['e',2],'ě':['e',3],'è':['e',4],
      'ī':['i',1],'í':['i',2],'ǐ':['i',3],'ì':['i',4],
      'ō':['o',1],'ó':['o',2],'ǒ':['o',3],'ò':['o',4],
      'ū':['u',1],'ú':['u',2],'ǔ':['u',3],'ù':['u',4],
      'ǖ':['ü',1],'ǘ':['ü',2],'ǚ':['ü',3],'ǜ':['ü',4]
    };
    const SYL_RE = /^(?:er|(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?([aeiouü]+)(ng(?![aeiouü])|n(?![aeiouü]))?)/;

    function pinyinSyllableToZhuyin(ini, fin, tone){
      ini = ini || '';
      if(ini === 'y'){
        if(fin[0] === 'u' || fin[0] === 'ü') fin = 'ü' + fin.slice(1);
        else if(fin[0] !== 'i') fin = 'i' + fin;
        ini = '';
      }else if(ini === 'w'){
        if(fin[0] !== 'u') fin = 'u' + fin;
        ini = '';
      }else if('jqx'.includes(ini) && ini && fin[0] === 'u'){
        fin = 'ü' + fin.slice(1);
      }
      let zyFin = ZY_FINAL[fin];
      if(zyFin === undefined) return null;
      // zh ch sh r z c s 後面單獨的 i 在注音裡不寫
      if(fin === 'i' && ['zh','ch','sh','r','z','c','s'].includes(ini)) zyFin = '';
      return (tone === 5 ? '˙' : '') + (ZY_INITIAL[ini] || '') + zyFin + (tone === 5 ? '' : ZY_TONE[tone]);
    }

    // 一個詞的拼音（可能是「xǐ huan」或連在一起的「xǐhuan」）→ 注音
    function toZhuyin(py){
      if(!py) return '';
      if(/[㄀-ㄯ]/.test(py)) return py;       // 本來就是注音，原樣顯示
      const chars = [], tones = [];
      for(const ch of String(py).toLowerCase().replace(/[\s'’\-]+/g, '')){
        if(TONED[ch]){ chars.push(TONED[ch][0]); tones.push(TONED[ch][1]); }
        else { chars.push(ch === 'v' ? 'ü' : ch); tones.push(0); }
      }
      let plain = chars.join(''), pos = 0;
      const out = [];
      while(pos < plain.length){
        const m = SYL_RE.exec(plain.slice(pos));
        if(!m){ return py; }                          // 看不懂就原樣顯示，不要亂轉
        const raw = m[0];
        let tone = 5;
        for(let i = pos; i < pos + raw.length; i++){ if(tones[i]){ tone = tones[i]; break; } }
        let zy;
        if(raw === 'er') zy = (tone === 5 ? '˙' : '') + 'ㄦ' + (tone === 5 ? '' : ZY_TONE[tone]);
        else zy = pinyinSyllableToZhuyin(m[1], m[2] + (m[3] || ''), tone);
        if(zy === null) return py;
        out.push(zy);
        pos += raw.length;
      }
      return out.join(' ');
    }

      if(fetching) return fetching;

        osc.type = 'sine';

      cells.forEach(c => { if(c.word) setPhon(c); });
      if(currentSentenceObj) renderTargetSentence();      // 拼音／注音切換後，題目句子要重畫
      else showPlaceholder(isPlaying ? 'loading' : 'placeholder');
    }

    function showPlaceholder(key){
      targetSentenceElem.classList.add('placeholder');
      targetSentenceElem.style.fontSize = '';
      targetSentenceElem.innerHTML = bi(key);
    }

    function updateStats(){
      const item = (icon, key, n) => `<span class="st">${icon}<span class="st-l">${bi(key)}</span><span class="st-c">:</span><b class="st-n">${n}</b></span>`;
      statTracker.innerHTML = item('🪙', 'hits', correctSentenceCount) + '<span class="st-sep">｜</span>' + item('❌', 'errs', errorHits);
    }

    // =====================================================================
    //  遊戲流程
    // =====================================================================
    startBtn.addEventListener("click", requestStart);   // 第一次會先問暱稱（見排行榜區塊）
    document.getElementById('modal-ok').addEventListener('click', () => {
      document.getElementById("result-modal").style.display = "none";
    });

    async function startGame(){
      if(isPlaying) return;
      isPlaying = true;
      ensureAudioCtx();
      startBtn.style.display = 'none';
      restartBtn.style.display = '';
      toggleSheet(false);
      renderSettings();

      if(!bankLoaded){
        showPlaceholder('loading');
        await bankReady;
      }

      timeLeft = 120;
      correctSentenceCount = 0;
      errorHits = 0;
      correctHits = 0;
      wrongStreak = 0; setHint(false); doneList = [];
      droughtRounds = 0;
      updateStats();
      loadNextSentence();
      startTimer();
      startMoleSpawner();
    }

    function startTimer(){
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if(timeLeft <= 0) endGame();
      }, 1000);
    }
    function updateTimerDisplay(){
      const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const s = String(timeLeft % 60).padStart(2, '0');
      timerElem.textContent = `${m}:${s}`;
    }

    const replayBtn = document.getElementById('replay-btn');
    replayBtn.addEventListener('click', () => { if(isPlaying && currentSentenceObj) speak(currentSentenceObj.text); });
    function loadNextSentence(){
      currentSentenceObj = sentenceFromDoc(takeNextDoc());
      replayBtn.disabled = false;
      targetIndex = 0;
      droughtRounds = 0;
      wrongStreak = 0; hintOn = false;
      renderTargetSentence();
      setHint(false);
      speak(currentSentenceObj.text);
    }

    let hintOn = false;
    const targetLbl = document.getElementById('target-lbl');
    // 題目框左上角那一行：平常顯示「照順序打出詞語」，連錯 3 次改成提示（同一個位置，高度不變）
    function refreshLabel(){
      targetLbl.innerHTML = bi(hintOn ? 'hint' : 'prompt');
      targetLbl.classList.toggle('hint', hintOn);
    }
    function setHint(on){
      hintOn = on;
      refreshLabel();
      const cur = targetSentenceElem.querySelector('.target-char.current');
      if(cur) cur.classList.toggle('glow', on);
    }
    // 題目句子：每個詞一格，上面依設定標拼音／注音，下面是中文字
    function renderTargetSentence(){
      targetSentenceElem.classList.remove('placeholder');
      targetSentenceElem.innerHTML = "";
      currentSentenceObj.words.forEach((word, idx) => {
        const span = document.createElement("span");
        span.className = "target-char";
        if(settings.phon !== 'off'){
          const ph = document.createElement("span");
          ph.className = "tc-ph";
          ph.textContent = phoneticFor(currentSentenceObj.pinyin[idx] || '');
          span.appendChild(ph);
        }
        const z = document.createElement("span");
        z.className = "tc-zh";
        z.textContent = word;
        span.appendChild(z);
        if(idx < targetIndex) span.classList.add("completed");
        if(idx === targetIndex){ span.classList.add("current"); if(hintOn) span.classList.add("glow"); }
        targetSentenceElem.appendChild(span);
      });
      fitSentence();
    }
    // 題目橫幅高度是固定的：句子太長（或標了拼音／注音）就把字級縮小到放得下為止，版面不會跳動
    function fitSentence(){
      const el = targetSentenceElem;
      if(!currentSentenceObj || el.classList.contains('placeholder')){ el.style.fontSize = ''; return; }
      let size = parseFloat(getComputedStyle(el).getPropertyValue('--ts-max')) || 40;
      el.style.fontSize = size + 'px';
      const limit = el.clientHeight * 0.9;               // 留一點空間給發光時放大的字
      while(size > 14){
        const first = el.firstElementChild, last = el.lastElementChild;
        if(!first || !last) break;
        const used = (last.offsetTop + last.offsetHeight) - first.offsetTop;
        if(used <= limit) break;
        size -= 2;
        el.style.fontSize = size + 'px';
      }
    }
    window.addEventListener('resize', fitSentence);

    // 依詞的長度調整字大小，長詞不會爆版（比例是相對於地鼠寬度）
    function sizeFactorForWord(word){
      const n = Array.from(word || '').length;
      return n <= 1 ? .50 : n === 2 ? .40 : n === 3 ? .32 : .25;
    }

    function startMoleSpawner(){
      const cfg = diffSettings[settings.diff];
      spawnInterval = setInterval(() => {
        droughtRounds++;
        const forceTarget = droughtRounds >= 3;
        let spawned = false;
        for(let i = 0; i < cfg.count; i++){
          const must = forceTarget && !spawned;
          if(popupMole(cfg.duration, must)) spawned = true;
        }
        if(spawned) droughtRounds = 0;
      }, cfg.interval);
    }

    function hideCell(cell){
      cell.up = false;
      cell.el.classList.remove('up');
    }

    function popupMole(duration, forceTarget = false){
      const free = cells.filter(c => !c.up && !c.hit);
      if(free.length === 0) return false;
      const cell = free[Math.floor(Math.random() * free.length)];

      // 10% 機會：沒有字卡的驚喜地鼠，隨機一種表情，只賣萌不計分
      if(!forceTarget && Math.random() < 0.10){
        const faces = ['2','3','4','5'];
        cell.mole.dataset.face = faces[Math.floor(Math.random() * faces.length)];
        cell.bonus = true; cell.word = ''; cell.pinyin = ''; cell._isExpected = false;
        cell.el.classList.add('bonus');
      }else{
        cell.mole.dataset.face = '1';
        cell.bonus = false;
        cell.el.classList.remove('bonus');

        const words = currentSentenceObj.words;
        const expected = words[targetIndex];
        let word, py;
        if(forceTarget){
          word = expected; py = currentSentenceObj.pinyin[targetIndex] || '';
        }else if(Math.random() < 0.6){
          const idx = Math.floor(Math.random() * words.length);
          word = words[idx]; py = currentSentenceObj.pinyin[idx] || '';
        }else{
          const item = pickDistractor();
          word = item.char; py = item.pinyin;
        }
        cell.word = word; cell.pinyin = py;
        cell._isExpected = (word === expected);
        cell.wordText.textContent = word;
        cell.card.style.setProperty('--k', sizeFactorForWord(word));
        cell.card.style.setProperty('--n', Math.max(1, Array.from(word).length));
        setPhon(cell);
      }

      cell.up = true;
      cell.el.classList.add('up');
      clearTimeout(cell.timer);
      cell.timer = setTimeout(() => hideCell(cell), duration);
      return !cell.bonus && cell._isExpected;
    }

    // ---- 打到地鼠 ----
    function hitCell(cell){
      if(!cell.up || cell.hit) return;
      clearTimeout(cell.timer);
      cell.hit = true;
      cell.mole.classList.add('hit');
      cell.el.classList.add('hit');

      if(cell.bonus){
        playHitSound(true);
      }else{
        const expected = currentSentenceObj.words[targetIndex];
        const ok = cell.word === expected;
        playHitSound(ok);
        speak(cell.word);
        if(ok){
          correctHits++;
          wrongStreak = 0; setHint(false);
          targetIndex++;
          droughtRounds = 0;
          renderTargetSentence();
          if(targetIndex >= currentSentenceObj.words.length){
            correctSentenceCount++;
            doneList.push(currentSentenceObj);
            triggerFireworks();
            clearTimeout(nextSentenceTimer);
            nextSentenceTimer = setTimeout(() => { if(isPlaying) loadNextSentence(); }, 600);
          }
        }else{
          errorHits++;
          cell.el.classList.add('wrong');
          wrongStreak++;
          const cur = targetSentenceElem.querySelector('.target-char.current');
          if(cur){ cur.classList.remove('nudge'); void cur.offsetWidth; cur.classList.add('nudge'); }
          if(wrongStreak >= 3) setHint(true);
        }
        updateStats();
      }

      // 先頭暈一下，再縮回洞裡
      setTimeout(() => {
        hideCell(cell);
        setTimeout(() => {
          cell.hit = false;
          cell.mole.classList.remove('hit');
          cell.el.classList.remove('hit','wrong');
        }, 260);
      }, 300);
    }

    const restartBtn = document.getElementById("restart-btn");
    restartBtn.addEventListener("click", () => {
      if(!isPlaying) return;
      endGame(false);          // 不顯示成績，直接回到待機並打開設定
      toggleSheet(true);
    });

    function buildReview(){
      const box = document.getElementById('review');
      const modal = box.parentElement;
      box.innerHTML = '';
      if(!doneList.length){ box.classList.remove('on'); modal.classList.remove('wide'); return; }
      modal.classList.add('wide');
      box.classList.add('on');
      const title = document.createElement('div');
      title.className = 'rv-title'; title.innerHTML = bi('review');
      box.appendChild(title);
      doneList.forEach(sen => {
        const row = document.createElement('div'); row.className = 'rv-item';
        const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = '🔊';
        btn.addEventListener('click', () => speak(sen.text));
        const info = document.createElement('div');
        const zh = document.createElement('div'); zh.className = 'rv-zh'; zh.textContent = sen.words.join(' ');
        info.appendChild(zh);
        if(settings.phon !== 'off'){
          const ph = document.createElement('div'); ph.className = 'rv-ph';
          ph.textContent = sen.pinyin.map(phoneticFor).join(' ');
          info.appendChild(ph);
        }
        if(sen.es){ const es = document.createElement('div'); es.className = 'rv-es'; es.textContent = sen.es; info.appendChild(es); }
        row.appendChild(btn); row.appendChild(info);
        box.appendChild(row);
      });
    }

    function endGame(showResult = true){
      clearInterval(timerInterval);
      clearInterval(spawnInterval);
      clearTimeout(nextSentenceTimer);
      isPlaying = false;
      wrongStreak = 0; setHint(false);
      cells.forEach(c => { clearTimeout(c.timer); hideCell(c); });
      if('speechSynthesis' in window) window.speechSynthesis.cancel();

      if(showResult){
        const res = computeScore(correctSentenceCount, correctHits, errorHits);
        document.getElementById("final-correct").textContent = correctSentenceCount;
        document.getElementById("final-errors").textContent = errorHits;
        document.getElementById("final-score").textContent = res.score;
        document.getElementById("final-acc").textContent = res.pct + '%';
        buildReview();
        document.getElementById("result-modal").style.display = "flex";
        handleRoundResult(res);                 // 送出成績、顯示名次（見排行榜區塊）
      }

      currentSentenceObj = null;
      replayBtn.disabled = true;
      showPlaceholder('placeholder');
      startBtn.style.display = '';
      restartBtn.style.display = 'none';
      timeLeft = 120; updateTimerDisplay();
      renderSettings();
    }

    // =====================================================================
    //  計分 + 暱稱 + 排行榜
    //
    //  分數 = 完成句數 × 100 + 準確度加分（準確度 × 50，最多 50；至少完成 1 句才給）
    //  準確度 = 打對的詞 ÷ (打對的詞 + 打錯的次數)；驚喜地鼠、沒打完的那一句都不算。
    //
    //  資料層只有兩個動作：submit(成績)、top(難度)。
    //    LocalBoard     ：存在這台瀏覽器（現在使用中，讓整個流程可以先跑起來）
    //    FirestoreBoard ：已經寫好，等你接 Firebase：
    //        1. 把下面 LEADERBOARD.useFirebase 改成 true
    //        2. 到 Firebase 主控台貼上 README 裡的安全規則
    //        3. 第一次開排行榜時，主控台的錯誤訊息會附一個建立索引的連結，點下去建立即可
    // =====================================================================
    const LEADERBOARD = {
      useFirebase: false,                 // ← 接上 Firebase 後改成 true
      collection: 'moleScores',           // 和「跑吧！漢字」的 mandarinRunnerScores 分開
      size: 10,                           // 每個難度顯示前幾名
      maxName: 12,
      defaultName: 'Jugador',
      localKey: 'moleScoresLocal',
      nameKey: 'moleName'
    };
    const DIFF_KEYS = ['easy', 'normal', 'hard'];

    function computeScore(sentences, correct, wrong){
      const total = correct + wrong;
      const accuracy = total > 0 ? correct / total : 0;
      const bonus = sentences > 0 ? Math.round(accuracy * 50) : 0;
      return { score: sentences * 100 + bonus, accuracy, pct: Math.round(accuracy * 100), sentences };
    }

    // ---- 暱稱 ----
    function cleanName(s){
      const t = Array.from(String(s || '').replace(/\s+/g, ' ').trim()).slice(0, LEADERBOARD.maxName).join('').trim();
      return t || LEADERBOARD.defaultName;
    }
    function nameKeyOf(name){ return String(name || '').normalize('NFKC').toLowerCase().trim(); }   // 同名（不分大小寫）視為同一人
    let playerName = null;                       // null = 還沒取過名字
    try{ const n = localStorage.getItem(LEADERBOARD.nameKey); if(n) playerName = cleanName(n); }catch(e){}
    function savePlayerName(raw){
      playerName = cleanName(raw);
      try{ localStorage.setItem(LEADERBOARD.nameKey, playerName); }catch(e){}
      return playerName;
    }

    // ---- 資料層：本機版 ----
    const LocalBoard = {
      isLocal: true,
      _read(){ try{ return JSON.parse(localStorage.getItem(LEADERBOARD.localKey) || '{}') || {}; }catch(e){ return {}; } },
      _write(o){ try{ localStorage.setItem(LEADERBOARD.localKey, JSON.stringify(o)); }catch(e){} },
      async submit(e){
        const all = this._read(), list = all[e.difficulty] || [], key = nameKeyOf(e.name);
        const i = list.findIndex(x => nameKeyOf(x.name) === key);
        const rec = { name: e.name, score: e.score, sentences: e.sentences, accuracy: e.accuracy, script: e.script, at: Date.now() };
        let improved = false, best = e.score;
        if(i < 0){ list.push(rec); improved = true; }
        else if(e.score > list[i].score){ list[i] = rec; improved = true; }
        else best = list[i].score;
        all[e.difficulty] = list;
        this._write(all);
        return { improved, best };
      },
      async top(difficulty){
        const list = (this._read()[difficulty] || []).slice();
        list.sort((a, b) => b.score - a.score || a.at - b.at);
        return list.slice(0, LEADERBOARD.size);
      }
    };

    // ---- 資料層：Firebase 版（已寫好、預設關閉）----
    // 文件：moleScores/{難度}__{暱稱小寫}，每人每個難度只留最高分（交易內比較，較低的分數不會覆蓋）
    const FirestoreBoard = {
      isLocal: false,
      _col(){ return db.collection(LEADERBOARD.collection); },
      _id(difficulty, name){ return difficulty + '__' + encodeURIComponent(nameKeyOf(name)).replace(/\./g, '%2E'); },
      async submit(e){
        const ref = this._col().doc(this._id(e.difficulty, e.name));
        let improved = false, best = e.score;
        await db.runTransaction(async tx => {
          const snap = await tx.get(ref);
          const old = snap.exists ? Number(snap.data().score) || 0 : -1;
          if(e.score > old){
            improved = true; best = e.score;
            tx.set(ref, {
              name: e.name, score: e.score, sentences: e.sentences, accuracy: Math.round(e.accuracy * 100),
              difficulty: e.difficulty, script: e.script,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }else{ improved = false; best = old; }
        });
        return { improved, best };
      },
      async top(difficulty){
        // 需要複合索引：difficulty（升冪）＋ score（降冪）
        const snap = await this._col().where('difficulty', '==', difficulty).orderBy('score', 'desc').limit(LEADERBOARD.size).get();
        return snap.docs.map(d => d.data());
      }
    };
    function activeBoard(){ return (LEADERBOARD.useFirebase && firebaseReady && db) ? FirestoreBoard : LocalBoard; }

    // ---- 這一局結束：送出成績、顯示名次 ----
    let roundToken = 0;
    async function handleRoundResult(res){
      const rankEl = document.getElementById('final-rank');
      const token = ++roundToken;
      if(res.sentences < 1){ rankEl.innerHTML = `<small class="tr">${zh('noScore')}</small>`; return; }
      rankEl.innerHTML = bi('saving');
      const entry = { name: playerName || LEADERBOARD.defaultName, score: res.score, sentences: res.sentences,
                      accuracy: res.accuracy, difficulty: settings.diff, script: settings.script };
      const board = activeBoard();
      try{
        const r = await board.submit(entry);
        const list = await board.top(entry.difficulty);
        if(token !== roundToken) return;
        const idx = list.findIndex(x => nameKeyOf(x.name) === nameKeyOf(entry.name));
        let html = idx >= 0 ? `${bi('rankNow')}: <strong>#${idx + 1}</strong>` : bi('notTop');
        html += r.improved ? `<span class="badge">${zh('newBest')}</span>` : `<br><small class="tr">${zh('best')}: ${r.best}</small>`;
        rankEl.innerHTML = html;
      }catch(err){
        console.warn('排行榜送出失敗:', err);
        if(token === roundToken) rankEl.innerHTML = bi('saveErr');
      }
    }

    // ---- 暱稱視窗（第一次按「開始」） ----
    const nameModal = document.getElementById('name-modal');
    const nameInput = document.getElementById('name-input');
    function requestStart(){
      if(isPlaying) return;
      if(playerName){ startGame(); return; }
      nameInput.value = '';
      nameInput.placeholder = LEADERBOARD.defaultName;
      nameModal.style.display = 'flex';
      setTimeout(() => nameInput.focus(), 50);
    }
    function confirmName(){
      savePlayerName(nameInput.value);
      nameModal.style.display = 'none';
      renderSettings();
      startGame();
    }
    document.getElementById('name-start').addEventListener('click', confirmName);
    nameInput.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) confirmName(); });

    // ---- 設定面板裡的暱稱欄 + 排行榜按鈕 ----
    function renderNickAndBoardSettings(){
      const wrap = document.createElement('div');
      wrap.className = 'set-group';
      wrap.innerHTML = `<div class="lbl">${bi('nick')}</div><input class="nick-input" id="nick-input" type="text" maxlength="${LEADERBOARD.maxName}" autocomplete="off" spellcheck="false">
        <button type="button" class="btn-ghost" id="open-board">${bi('board')}</button>`;
      const input = wrap.querySelector('#nick-input');
      input.value = playerName || '';
      input.placeholder = LEADERBOARD.defaultName;
      input.disabled = isPlaying;
      const commit = () => { if(input.value.trim() || playerName){ input.value = savePlayerName(input.value); } };
      input.addEventListener('change', commit);
      input.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) input.blur(); });
      wrap.querySelector('#open-board').addEventListener('click', () => { toggleSheet(false); openBoard(settings.diff); });
      settingsBox.appendChild(wrap);
    }

    // ---- 排行榜視窗 ----
    const boardModal = document.getElementById('board-modal');
    const boardBody = document.getElementById('board-body');
    const boardTabs = document.getElementById('board-tabs');
    const boardNote = document.getElementById('board-note');
    let boardDiff = 'easy', boardToken = 0;
    function openBoard(diff){
      boardModal.style.display = 'flex';
      showBoardTab(DIFF_KEYS.includes(diff) ? diff : 'easy');
    }
    function renderBoardTabs(){
      boardTabs.innerHTML = '';
      DIFF_KEYS.forEach(k => {
        const b = document.createElement('button');
        b.type = 'button'; b.innerHTML = bi(k); b.dataset.v = k;
        if(k === boardDiff) b.classList.add('on');
        b.addEventListener('click', () => showBoardTab(k));
        boardTabs.appendChild(b);
      });
    }
    async function showBoardTab(diff){
      boardDiff = diff;
      renderBoardTabs();
      const board = activeBoard(), token = ++boardToken;
      boardNote.innerHTML = board.isLocal ? bi('localNote') : '';
      const msg = key => { boardBody.innerHTML = `<div class="bd-msg">${bi(key)}</div>`; };
      msg('boardLoading');
      try{
        const list = await board.top(diff);
        if(token !== boardToken) return;
        if(!list.length){ msg('boardEmpty'); return; }
        const ol = document.createElement('ol'); ol.className = 'bd-list';
        list.forEach((x, i) => {
          const li = document.createElement('li');
          if(playerName && nameKeyOf(x.name) === nameKeyOf(playerName)) li.className = 'me';
          const r = document.createElement('span'); r.className = 'bd-rank'; r.textContent = i + 1;
          const n = document.createElement('span'); n.className = 'bd-name'; n.textContent = x.name;   // 用 textContent，別人的暱稱不會變成程式碼
          const s = document.createElement('span'); s.className = 'bd-score'; s.textContent = x.score;
          li.append(r, n, s); ol.appendChild(li);
        });
        boardBody.innerHTML = ''; boardBody.appendChild(ol);
      }catch(err){
        console.warn('讀取排行榜失敗:', err);
        if(token === boardToken) msg('boardErr');
      }
    }
    document.getElementById('board-close').addEventListener('click', () => { boardModal.style.display = 'none'; });
    document.getElementById('result-board').addEventListener('click', () => openBoard(settings.diff));

    // =====================================================================
    //  煙火（馬力歐配色）
    // =====================================================================
    const canvas = document.getElementById("firework-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    const fireworkColors = ["#E52521", "#FBD000", "#43B047", "#049CD8", "#ffffff"];
    function resizeCanvas(){
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    function triggerFireworks(){
      const x = canvas.width / 2, y = canvas.height / 3;
      for(let i = 0; i < 40; i++){
        const a = Math.random() * Math.PI * 2, s = Math.random() * 5 + 2;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, alpha: 1,
          color: fireworkColors[Math.floor(Math.random() * fireworkColors.length)] });
      }
    }
    function updateFireworks(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for(let i = particles.length - 1; i >= 0; i--){
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
        if(p.alpha <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(updateFireworks);
    }
    updateFireworks();

    // 手機直式：計時器放進題目橫幅右上角；其他版面（電腦、平板橫放、手機橫放）計時器留在原本的位置
    const portraitMQ = window.matchMedia('(max-width: 820px) and (orientation: portrait)');
    function placeTimer(){
      const t = document.querySelector('.timer-box'), box = document.querySelector('.target-box'), hud = document.getElementById('hud');
      if(portraitMQ.matches){ if(t.parentElement !== box) box.insertBefore(t, document.getElementById('replay-btn')); }
      else if(t.parentElement !== hud){ hud.insertBefore(t, box); }
      if(currentSentenceObj) fitSentence();
    }
    if(portraitMQ.addEventListener) portraitMQ.addEventListener('change', placeTimer); else portraitMQ.addListener(placeTimer);
    placeTimer();

    applyUi();
    showPlaceholder('placeholder');
  </script>
</body>
</html>
